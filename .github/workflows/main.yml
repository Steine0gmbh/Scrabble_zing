# Baut das Zing-Wortspiel auf einem Cloud-Mac als unsignierte IPA.
# Signiert und installiert wird danach mit Sideloadly oder AltStore (siehe ios-app/ANLEITUNG.md).
name: iOS IPA bauen

on:
  push:
    branches: [main]
    paths:
      - "ios-app/**"
      - ".github/workflows/ios-ipa.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: npm install

      - name: iOS-Projekt erzeugen
        run: |
          npx cap add ios
          npx cap sync ios

      - name: App-Symbol setzen
        run: |
          set -e
          ICONSET=ios/App/App/Assets.xcassets/AppIcon.appiconset
          for f in "$ICONSET"/*.png; do cp resources/icon-1024.png "$f"; done

      - name: App bauen (unsigniert)
        run: |
          set -e
          cd ios/App
          # Capacitor nutzt je nach Version CocoaPods (Workspace) oder Swift Package Manager (Projekt)
          if [ -d App.xcworkspace ]; then TARGET="-workspace App.xcworkspace"; else TARGET="-project App.xcodeproj"; fi
          xcodebuild $TARGET -scheme App -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr ../../Zing-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Zing-unsigned-ipa
          path: ios-app/Zing-unsigned.ipa
